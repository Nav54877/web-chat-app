<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="0.55" stop-color="#141726"/>
      <stop offset="1" stop-color="#1c1430"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#9a6cff"/>
    </linearGradient>
    <linearGradient id="bub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#9a6cff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="18" fill="url(#bg)"/>
  <circle cx="90" cy="60" r="130" fill="#6c8cff" opacity="0.07"/>
  <circle cx="720" cy="180" r="150" fill="#9a6cff" opacity="0.08"/>

  <!-- chat bubbles mark -->
  <g transform="translate(88,58)">
    <path d="M0 10 q0 -10 10 -10 h46 q10 0 10 10 v22 q0 10 -10 10 h-30 l-12 12 v-12 h-4 q-10 0 -10 -10 z" fill="url(#bub)"/>
    <circle cx="20" cy="26" r="3.4" fill="#fff"/>
    <circle cx="33" cy="26" r="3.4" fill="#fff"/>
    <circle cx="46" cy="26" r="3.4" fill="#fff"/>
    <path d="M40 44 q0 -8 8 -8 h34 q8 0 8 8 v14 q0 8 -8 8 h-22 l-9 9 v-9 h-3 q-8 0 -8 -8 z" fill="#232840" stroke="#3a4160"/>
    <circle cx="56" cy="56" r="2.6" fill="#8b93a7"/>
    <circle cx="65" cy="56" r="2.6" fill="#8b93a7"/>
    <circle cx="74" cy="56" r="2.6" fill="#8b93a7"/>
  </g>

  <text x="210" y="120" font-size="64" font-weight="800" letter-spacing="1" fill="url(#word)">banter</text>
  <text x="212" y="152" font-size="16" fill="#8b93a7">real-time public chat rooms — no accounts, no database, just talk</text>
  <g font-family="Menlo,Consolas,monospace" font-size="12.5">
    <rect x="212" y="168" width="296" height="26" rx="13" fill="#1a1d29" stroke="#2a3040"/>
    <circle cx="228" cy="181" r="4" fill="#5ad19a"/>
    <text x="240" y="185" fill="#c0caf5">$ npm install &amp;&amp; npm start</text>
  </g>
</svg>
